name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows (MSVC + Ninja)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: C unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Install PyTorch (CPU) and NumPy
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Parity harness
        run: python tests/parity/run.py
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-windows
          path: tests/parity/reports/latest.json

  linux:
    name: Linux (gcc + Ninja, software Vulkan available)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build and software Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build mesa-vulkan-drivers
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: C unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Confirm a software Vulkan ICD is present
        run: |
          if command -v vulkaninfo >/dev/null; then vulkaninfo --summary; else echo "vulkaninfo not installed; lavapipe present for future Vulkan CI"; fi
      - name: Install PyTorch (CPU) and NumPy
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Parity harness
        run: python tests/parity/run.py
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-linux
          path: tests/parity/reports/latest.json
